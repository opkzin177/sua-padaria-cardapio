<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua Padaria - Cardápio Lanchonete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1f1a;
      --card: #142a23;
      --accent: #d4af37;
      --text: #f5f0e6;
      --muted: #a8b5ad;
      --border: #2a4038;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
      background: linear-gradient(180deg, #0a1814 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: var(--accent);
      letter-spacing: 2px;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      font-size: 1.1rem;
      color: var(--muted);
      font-weight: 500;
    }
    .slogan {
      margin-top: 0.8rem;
      font-style: italic;
      color: var(--accent);
      font-size: 0.95rem;
    }
    .controls {
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
    }
    #search {
      flex: 1;
      min-width: 220px;
      max-width: 400px;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #0d1f1a;
      border-color: var(--accent);
      font-weight: 600;
    }
    main {
      max-width: 1200px;
      margin: 0 auto 3rem;
      padding: 0 1rem;
    }
    .category {
      margin: 2.5rem 0 1.5rem;
    }
    .category h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.4rem;
      margin-bottom: 1.2rem;
      display: inline-block;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .product {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      transition: transform 0.15s, border-color 0.15s;
    }
    .product:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .product-info { flex: 1; }
    .product-code {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .product-name {
      font-size: 1rem;
      font-weight: 500;
      margin: 0.2rem 0 0.3rem;
    }
    .product-price {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 600px) {
      .logo { font-size: 1.9rem; }
      .products { grid-template-columns: 1fr; }
    }
  </style>
</head>

    const menuEl = document.getElementById('menu');
    const searchEl = document.getElementById('search');
    const filtersEl = document.getElementById('filters');

    let activeCategory = 'Todos';

    function renderFilters() {
      const cats = ['Todos', ...menuData.map(c => c.category)];
      filtersEl.innerHTML = cats.map(cat => 
        `<button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
      ).join('');
      filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          renderFilters();
          renderMenu();
        });
      });
    }

    function renderMenu() {
      const q = searchEl.value.toLowerCase().trim();
      menuEl.innerHTML = '';
      menuData.forEach(cat => {
        if (activeCategory !== 'Todos' && cat.category !== activeCategory) return;
        const filtered = cat.items.filter(item => 
          item.name.toLowerCase().includes(q) || (item.code && item.code.includes(q))
        );
        if (filtered.length === 0) return;
        const section = document.createElement('section');
        section.className = 'category';
        section.innerHTML = `<h2>${cat.category}</h2><div class="products"></div>`;
        const products = section.querySelector('.products');
        filtered.forEach(item => {
          const div = document.createElement('div');
          div.className = 'product';
          div.innerHTML = `
            <div class="product-info">
              ${item.code ? `<div class="product-code">Cód. ${item.code}</div>` : ''}
              <div class="product-name">${item.name}</div>
            </div>
            <div class="product-price">R$ ${item.price}</div>
          `;
          products.appendChild(div);
        });
        menuEl.appendChild(section);
      });
      if (menuEl.children.length === 0) {
        menuEl.innerHTML = '<p style="text-align:center;color:var(--muted);margin:3rem 0;">Nenhum produto encontrado.</p>';
      }
    }

    searchEl.addEventListener('input', renderMenu);
    renderFilters();
    renderMenu();
